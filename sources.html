    <main class="shell compact-page">
      <section class="page-intro"><p class="eyebrow">信息源</p><h1>打开官网吗，<br /><em>和采集路线分开看。</em></h1><p>用户自行查看的官方入口，与后台收集、筛选和核验公开信息的路线严格分开呈现。</p></section>
      <section class="city-switcher" aria-labelledby="city-title"><div><p class="eyebrow">选择关注范围</p><h2 id="city-title">选择城市</h2></div><div class="city-tabs" id="city-tabs" role="tablist" aria-label="选择城市"></div></section>
      <section class="page-content" aria-live="polite"><div class="section-heading"><div><p class="eyebrow">来源目录</p><h2 id="source-heading">官方快捷入口</h2></div></div><p class="source-intro" id="source-intro">方便直接进入各个官方平台，不显示采集状态。</p><div class="source-view-tabs" role="tablist" aria-label="信息源展示方式"><button class="active" data-source-view="shortcut" role="tab" aria-selected="true" type="button">官方快捷入口</button><button data-source-view="collection" role="tab" aria-selected="false" type="button">采集与核验路线</button></div><div class="source-grid" id="source-list"><p class="loading">正在读取信息源…</p></div></section>
    </main>
    <dialog id="admin-dialog" class="favorite-dialog admin-dialog" aria-labelledby="admin-dialog-title">
      <form method="dialog" class="dialog-close"><button aria-label="关闭" type="submit">×</button></form><p class="eyebrow">管理员</p><h2 id="admin-dialog-title">更新控制台</h2><p id="admin-login-copy">登录后可以控制四座城市何时执行完整更新。</p>
      <div id="admin-login-fields"><label for="admin-username">账号</label><input id="admin-username" autocomplete="username" spellcheck="false" /><label for="admin-password">密码</label><input id="admin-password" type="password" autocomplete="current-password" /></div>
      <div id="admin-update-controls" class="schedule-panel" hidden><label class="confirmation"><input id="update-schedule-enabled" type="checkbox" />启用服务器自动更新</label><label for="update-schedule-times">每日运行时间（北京时间，多个时间用逗号分隔）</label><input id="update-schedule-times" inputmode="numeric" placeholder="09:00, 14:00" /><p class="schedule-status" id="update-schedule-status">正在读取更新计划…</p><button class="primary-button" id="save-update-schedule" type="button">保存更新计划</button></div>
      <section id="sync-progress" class="sync-progress" hidden aria-live="polite"><div class="sync-progress-heading"><strong id="sync-progress-title">最近一次更新</strong><span id="sync-progress-meta"></span></div><ol id="sync-event-list" class="sync-event-list"></ol></section>
      <div class="dialog-actions"><button class="primary-button" id="admin-login" type="button">登录</button><button class="outline-button" id="admin-logout" type="button" hidden>退出登录</button><button class="outline-button" id="run-full-sync" type="button" hidden>立即全量更新</button></div><p class="dialog-note" id="admin-feedback" aria-live="polite"></p>
